version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://startup_admin:Marketplace_Secure_2026!@db:5432/startup_marketplace_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=startup_admin
      - POSTGRES_PASSWORD=Marketplace_Secure_2026!
      - POSTGRES_DB=startup_marketplace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
