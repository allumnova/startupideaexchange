server {
    listen 80;
    server_name startupideaexchange.com www.startupideaexchange.com;

    location / {
        proxy_pass http://localhost:80; # Points to the frontend container (port 80 in docker-compose.prod.yml)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://localhost:5000; # Points to the backend container (port 5000 in docker-compose.prod.yml)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
