server {
    listen 80;
    listen [::]:80;
    server_name startupideaexcahnge.in www.startupideaexcahnge.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name startupideaexcahnge.in www.startupideaexcahnge.in;

    ssl_certificate /etc/letsencrypt/live/startupideaexcahnge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/startupideaexcahnge.in/privkey.pem;
    
    # Adding standard SSL optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://localhost:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
