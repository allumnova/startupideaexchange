name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          # Create directory if not exists
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "mkdir -p ~/startup-marketplace"
          
          # Copy backend, frontend, and compose file
          # We use tar + ssh for faster transfer than individual scp calls
          tar czf deploy_bundle.tar.gz backend frontend docker-compose.prod.yml
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no deploy_bundle.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:~/startup-marketplace/
          
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/startup-marketplace
            
            # Extract the code
            tar xzf deploy_bundle.tar.gz
            rm deploy_bundle.tar.gz
            
            # Build and start containers directly on the VPS
            # This bypasses all registry/packaging issues
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d --build
            
            # Prune unused images to save space
            docker image prune -f
