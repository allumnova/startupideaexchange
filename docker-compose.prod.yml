version: '3.8'

services:
  backend:
    build: ./backend
    restart: always
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://startup_admin:Marketplace_Secure_2026!@db:5432/startup_marketplace_db
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=startup_admin
      - POSTGRES_PASSWORD=Marketplace_Secure_2026!
      - POSTGRES_DB=startup_marketplace_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
