version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ato-backend
    restart: always
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://startup_admin:password123@db:5432/startup_marketplace_db?schema=public
      - JWT_SECRET=super_secret_jwt_key_2026
    ports:
      - "5001:5000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ato-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: ato-db
    restart: always
    environment:
      - POSTGRES_USER=startup_admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=startup_marketplace_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
